# Local infrastructure only (§37.2, Q157). Application processes are not here
# yet: they arrive with the API in WS-7 and the workers in WS-8..WS-10.
#
# Qdrant is deliberately absent this sprint. Nothing retrieves yet, and an
# unused service is maintenance cost with no test behind it; it joins in
# Sprint 8 with the knowledge pipeline.

name: gym-track

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gym_track
      POSTGRES_USER: gym_track
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_track -d gym_track"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gym_track
      RABBITMQ_DEFAULT_PASS: local-dev-only
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    # Redis holds debounce state only, and §10 declares it non-authoritative:
    # appendonly stays off because losing it must be survivable by design.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  rabbitmq-data:
